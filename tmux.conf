set-option -g prefix C-Space
bind-key C-Space send-prefix

set -g mouse on
set -g status-style "bg=#303030,fg=#48b1c0"

set -g base-index 1
setw -g pane-base-index 1

# Vim-style copy mode
setw -g mode-keys vi

# Clipboard: Hyprland / Wayland
set -g @override_copy_command 'wl-copy'

# Remove underline from active window
set -g window-status-current-style "nounderscore"
set -g window-status-style "nounderscore"

# Vim motions and selections
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selection to system clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Copy whole line directly
bind-key -T copy-mode-vi Y send-keys -X copy-line \; run-shell "tmux save-buffer - | wl-copy"

# Window switching with Alt+number
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# tmux-sessionizer (Ctrl+f directly or prefix + f)
bind-key -n C-f display-popup -E -w 75% -h 65% "~/.local/bin/tmux-sessionizer"
bind-key f display-popup -E -w 75% -h 65% "~/.local/bin/tmux-sessionizer"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
